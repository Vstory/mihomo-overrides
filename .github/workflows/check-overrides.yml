name: check-overrides

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同一分支只留最新一次：校验本身幂等，旧 run 被新提交取代后没有价值
concurrency:
  group: check-overrides-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # 钉到具体 GA 镜像，不跟 -latest 漂移；26.04 已是 GA，-latest 还停在 24.04
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      # 本仓库策略要求 action 钉到完整 commit SHA，写 tag 会被 Actions 直接拒绝
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      # 只装一个包，不值得为它配缓存（缓存价值来自重复下载大依赖）
      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml

      - name: Validate overrides
        run: python3 Scripts/check_overrides.py

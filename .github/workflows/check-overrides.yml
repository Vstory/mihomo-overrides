name: check-overrides

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同一分支只留最新一次：校验本身幂等，旧 run 被新提交取代后没有价值
concurrency:
  group: check-overrides-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 本仓库策略要求 action 钉到完整 commit SHA，写 tag 会被 Actions 直接拒绝
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      # 只装一个包，不值得为它配缓存（缓存价值来自重复下载大依赖）
      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml

      - name: Validate overrides
        run: python3 Scripts/check_overrides.py

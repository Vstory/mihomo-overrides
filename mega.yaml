# Version 2.4.0 · 2026-10-22 23:14 ── switch MEGA group to url-test probed against mega.nz
# MEGA 覆写（YAML）。用法：Mishka → 配置 → 覆写 → 新增 → 远程下载 → 填本文件 raw 地址。
#   键位语法按 PC 版：+key 数组前插、key+ 追加、key! 强制替换、其余深度合并。
#   组位置：键位只有前插（+proxy-groups）与追加（proxy-groups+），落不到指定位置。本文件用前插，
#   MEGA 会出现在列表最顶端；要排在「节点选择」「自动选择」之后请改用 mega.js（那边用 splice 算位置）。
#   rules 是顺序匹配：必须前插，追加到末尾等于永不命中（订阅的兜底规则先吃掉流量）。
#
#   规则来源（都不用手写维护）：
#     域名 —— rule-provider 拉 MetaCubeX 的 mega.mrs（对应 v2fly domain-list-community 的 mega
#             分类，7 条域名，含 transfer.it / megapay.nz 这类容易漏的）；不用 GEOSITE,mega
#             是因为它依赖内置 geosite.dat 是否打包了该分类，rule-provider 不依赖本地数据版本。
#     IP   —— IP-ASN 直接按 MEGA 自有 ASN 匹配，不用再手抄网段；依赖 ASN.mmdb（Mishka 内置）。
#
#   include-all 让组自动并入订阅里的全部节点（proxies 与 proxy-providers 都算），换订阅、
#   加节点都不用改本文件。代价：机场塞的伪节点（"剩余流量：948 GB"这类）也会进组，且
#   exclude-filter 只对 provider 节点生效、管不到 include-all 的项 —— 要剔掉伪节点请改用 mega.js。

+proxy-groups:
  # url-test 而不是 select：select 选中的节点一旦断了就一直用它，日志上表现为
  # IPCIDR 命中本组却连不上（dial tcp ... i/o timeout）。测速地址特意用 mega.nz，
  # 只有真能连上 MEGA 的节点才算可用；用 gstatic 的 204 会放过「204 通但连不上 MEGA」的节点。
  # 代价：url-test 的成员只能是节点，不能含其它 proxy-group，运营商聚合组因此不进本组。
  - name: 🌐 MEGA
    type: url-test
    url: https://mega.nz/
    interval: 300
    tolerance: 50
    icon: https://raw.githubusercontent.com/Vstory/mihomo-overrides/main/icons/mega.png
    include-all: true

rule-providers:
  mega-site:
    type: http
    behavior: domain
    format: mrs
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/mega.mrs
    path: ./ruleset/mega.mrs
    interval: 86400

+rules:
  # rules 顺序匹配，必须前插：追加到末尾等于永不命中（订阅的兜底规则先吃掉流量）
  # 主力域名手写一份放在 RULE-SET 之前：provider 首次拉取失败时 RULE-SET 匹配不到任何
  # 域名，MEGA 会一路落到订阅兜底规则，表现为"规则没生效"。
  - DOMAIN-SUFFIX,mega.nz,🌐 MEGA
  - DOMAIN-SUFFIX,mega.io,🌐 MEGA
  - DOMAIN-SUFFIX,mega.co.nz,🌐 MEGA
  - DOMAIN-SUFFIX,transfer.it,🌐 MEGA
  - RULE-SET,mega-site,🌐 MEGA
  # 具体网段写在 IP-ASN 前面：IP-ASN 依赖 ASN.mmdb 被正确加载，加载不上时这条会整体失效，
  # 网段不依赖任何数据文件，是唯一不会静默失效的兜底。AS203055 的前缀粒度碎到有 33 条 /48，
  - IP-CIDR,31.216.144.0/22,🌐 MEGA,no-resolve
  - IP-CIDR,31.216.148.0/24,🌐 MEGA,no-resolve
  - IP-CIDR,66.203.124.0/22,🌐 MEGA,no-resolve
  - IP-CIDR,82.21.172.0/24,🌐 MEGA,no-resolve
  - IP-CIDR,82.29.203.0/24,🌐 MEGA,no-resolve
  - IP-CIDR,82.29.204.0/22,🌐 MEGA,no-resolve
  - IP-CIDR,89.44.168.0/23,🌐 MEGA,no-resolve
  - IP-CIDR,94.24.36.0/23,🌐 MEGA,no-resolve
  - IP-CIDR,162.208.16.0/24,🌐 MEGA,no-resolve
  - IP-CIDR,185.206.24.0/22,🌐 MEGA,no-resolve
  - IP-CIDR,217.180.20.0/23,🌐 MEGA,no-resolve
  - IP-CIDR6,2001:67c:1998::/48,🌐 MEGA,no-resolve
  - IP-CIDR6,2001:678:25c::/48,🌐 MEGA,no-resolve
  - IP-CIDR6,2a09:a381::/39,🌐 MEGA,no-resolve
  - IP-CIDR6,2a0b:e40::/31,🌐 MEGA,no-resolve
  - IP-CIDR6,2a0b:e42::/31,🌐 MEGA,no-resolve
  - IP-CIDR6,2a0b:e44::/31,🌐 MEGA,no-resolve
  # AS203055 = MEGA-LIMITED-AS，AS205809 = MEGA Privacy Kft.
  - IP-ASN,203055,🌐 MEGA,no-resolve
  - IP-ASN,205809,🌐 MEGA,no-resolve

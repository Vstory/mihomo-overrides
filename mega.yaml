# Version 2.8.0 · 2026-10-22 23:47 ── restore select with auto-select, node-select and DIRECT in the group head
# MEGA 覆写（YAML）。用法：Mishka → 配置 → 覆写 → 新增 → 远程下载 → 填本文件 raw 地址。
#   键位语法按 PC 版：+key 数组前插、key+ 追加、key! 强制替换、其余深度合并。
#   组位置：键位只有前插（+proxy-groups）与追加（proxy-groups+），落不到指定位置。本文件用前插，
#   MEGA 会出现在列表最顶端；要排在「节点选择」「自动选择」之后请改用 mega.js（那边用 splice 算位置）。
#   rules 是顺序匹配：必须前插，追加到末尾等于永不命中（订阅的兜底规则先吃掉流量）。
#
#   规则来源（都不用手写维护）：
#     域名 —— GEOSITE,mega。Mishka 构建时会把 meta-rules-dat 的 latest geosite.dat 打进 APK
#             （app/build.gradle.kts），里面就有 mega 分类（7 条，与 v2fly domain-list-community
#             的 data/mega 同源）。代价：跟着 app 版本走，不更新客户端就一直用打包时的快照。
#     IP   —— IP-ASN 直接按 MEGA 自有 ASN 匹配，不用再手抄网段；依赖 ASN.mmdb（Mishka 内置）。
#
#   include-all 让组自动并入订阅里的全部节点（proxies 与 proxy-providers 都算），换订阅、
#   加节点都不用改本文件。代价：机场塞的伪节点（"剩余流量：948 GB"这类）也会进组，且
#   exclude-filter 只对 provider 节点生效、管不到 include-all 的项 —— 要剔掉伪节点请改用 mega.js。

+proxy-groups:
  # select 而不是 url-test：只有 select 的成员能放 proxy-group，才能把「自动选择」「节点选择」
  # 和运营商聚合组挑进本组。代价是选中的节点断了不会自己换 —— 日志里 IPCIDR 命中本组却
  # dial tcp ... i/o timeout 时，到代理页手动切一个能连的节点。
  # 这两个组名硬写在这里：订阅里没有该组的话内核会整份配置校验失败，mega.js 会先检测再引用。
  - name: 🌐 MEGA
    type: select
    icon: https://raw.githubusercontent.com/Vstory/mihomo-overrides/main/icons/mega.png
    include-all: true
    proxies:
      - ♻️自动选择
      - 🚀节点选择
      - DIRECT

+rules:
  # rules 顺序匹配，必须前插：追加到末尾等于永不命中（订阅的兜底规则先吃掉流量）
  - GEOSITE,mega,🌐 MEGA
  # 网段直接取 AS203055 + AS205809 的公开公告前缀（RIPEstat），全量收、不聚合：
  # 聚合会顺带覆盖同段里的邻接分配，而且漏掉 2a0b:e46:1::/48 这种零散前缀时无从察觉。
  # 公告前缀会变，IP-ASN 放在最后当动态兜底。
  - IP-CIDR,162.208.16.0/24,🌐 MEGA,no-resolve

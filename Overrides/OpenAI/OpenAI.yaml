# Title: OpenAI 覆写（YAML）
# Description: 订阅全部节点经 include-all 并入 🤖 OpenAI 组，18 条域名规则前插
# Version: 0.0.1
# Last modified: 2026-10-30 19:13
# Changelog: initial override for OpenAI
#
# 用法：Mishka → 配置 → 覆写 → 新增 → 远程下载 → 填本文件 raw 地址。
#   键位语法按 PC 版：+key 数组前插、key+ 追加、key! 强制替换、其余深度合并。
#   组位置：键位只有前插（+proxy-groups）与追加（proxy-groups+），落不到指定位置。本文件用前插，
#   OpenAI 会出现在列表最顶端；要排在「节点选择」「自动选择」之后请改用 OpenAI.js。
#   rules 是顺序匹配：必须前插，追加到末尾等于永不命中（订阅的兜底规则先吃掉流量）。
#
# 域名清单取自 v2fly/domain-list-community 的 openai 分类（与 geosite 同源），逐条转写：
#   普通项 → DOMAIN-SUFFIX；full: 前缀（Azure 存储、Azure Front Door、imgix）→ DOMAIN 精确匹配。
# 有意的取舍：
#   - 不收 host.livekit.cloud / turn.livekit.cloud：LiveKit Cloud 是全平台共享端点，
#     收进来会误伤其它用它的音视频服务；ChatGPT 语音的信令 chatgpt.livekit.cloud 已覆盖。
#   - 不收分类里带 @ads / @telemetry 的条目（Datadog、Sentry、Qualtrics）：遥测不影响功能。
#   - 不收 regexp: 开头的 webpubsub 条目：那是随部署变化的随机子域，写死必失效。
#
# 没有 IP 规则：ChatGPT 与 API 出口都在 Cloudflare / Azure 上，OpenAI 没有自有 ASN 可收，
# 按 IP 收会误伤同段租户 —— 同 GitHub / Boosty，凑不出「域名 + 网段 + ASN」三层就不硬凑。
#
#   include-all 让组自动并入订阅里的全部节点，换订阅、加节点都不用改本文件。代价：机场塞的伪节点
#   （"剩余流量：948 GB"这类）也会进组，且 exclude-filter 管不到 include-all 的项 —— 要剔掉伪节点
#   请改用 OpenAI.js。

  # 主组用 select：只有 select 的成员能放 proxy-group，「自动选择」「节点选择」和下面的
  #   国家/地区组才进得来。proxies 顺序 = 自动选择 → 节点选择 → DIRECT → 国家/地区，
  #   平铺节点由 include-all 追加在最后（内核行为，写不到前面）。
  # 组名硬写在这里：订阅里没有该组的话内核会整份配置校验失败，OpenAI.js 会先检测再引用。
+proxy-groups:
  - name: 🤖 OpenAI
    type: select
    icon: https://raw.githubusercontent.com/Vstory/mihomo-overrides/main/Icons/png/OpenAI.png
    include-all: true
    proxies:
      - ♻️自动选择
      - 🚀节点选择
      - DIRECT
      - 🤖 香港
      - 🤖 台湾
      - 🤖 日本
      - 🤖 韩国
      - 🤖 新加坡
      - 🤖 美国
      - 🤖 英国
      - 🤖 德国
      - 🤖 荷兰
      - 🤖 俄罗斯
      - 🤖 加拿大
      - 🤖 澳大利亚
      - 🤖 法国
      - 🤖 马来西亚
      - 🤖 泰国
      - 🤖 越南
      - 🤖 印度
      - 🤖 印度尼西亚
      - 🤖 菲律宾
      - 🤖 土耳其
      - 🤖 巴西
      - 🤖 阿联酋
      - 🤖 意大利
      - 🤖 西班牙

  # 国家/地区组：固定 24 个清单，filter 在运行时匹配节点名（provider 里的节点也能筛）。
  #   · (?i) 必须带：内核 filter 走 regexp2，默认区分大小写
  #   · 两字母代码包 \b 词边界，否则 US 会吃 Russia、IN 会吃 Singapore
  #   · empty-fallback 必须显式写 DIRECT：内核默认回退 COMPATIBLE，订阅没这个组会校验失败
  #   · lazy 只在使用时测速省电；tolerance 防抖（延迟差 50ms 内不换节点）
proxy-groups+:
  - name: 🤖 香港
    type: url-test
    include-all: true
    filter: '(?i)香港|🇭🇰|\bhk\b|hong ?kong|港'
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true
    empty-fallback: DIRECT
  - name: 🤖 台湾
    type: url-test
    include-all: true
    filter: '(?i)台湾|台灣|🇹🇼|\btw\b|taiwan|台'

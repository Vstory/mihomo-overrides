# Version 0.1.5 · 2026-10-29 00:23 ── use PascalCase icon filenames
# MEGA 覆写（YAML）。用法：Mishka → 配置 → 覆写 → 新增 → 远程下载 → 填本文件 raw 地址。
#   键位语法按 PC 版：+key 数组前插、key+ 追加、key! 强制替换、其余深度合并。
#   组位置：键位只有前插（+proxy-groups）与追加（proxy-groups+），落不到指定位置。本文件用前插，
#   MEGA 会出现在列表最顶端；要排在「节点选择」「自动选择」之后请改用 mega.js（那边用 splice 算位置）。
#   rules 是顺序匹配：必须前插，追加到末尾等于永不命中（订阅的兜底规则先吃掉流量）。
#
#   规则来源（都不用手写维护）：
#     域名 —— GEOSITE,mega。Mishka 构建时会把 meta-rules-dat 的 latest geosite.dat 打进 APK
#             （app/build.gradle.kts），里面就有 mega 分类（7 条，与 v2fly domain-list-community
#             的 data/mega 同源）。代价：跟着 app 版本走，不更新客户端就一直用打包时的快照。
#     IP   —— IP-ASN 直接按 MEGA 自有 ASN 匹配，不用再手抄网段；依赖 ASN.mmdb（Mishka 内置）。
#
#   include-all 让组自动并入订阅里的全部节点（proxies 与 proxy-providers 都算），换订阅、
#   加节点都不用改本文件。代价：机场塞的伪节点（"剩余流量：948 GB"这类）也会进组，且
#   exclude-filter 只对 provider 节点生效、管不到 include-all 的项 —— 要剔掉伪节点请改用 mega.js。

  # 主组用 select：只有 select 的成员能放 proxy-group，「自动选择」「节点选择」和下面的
  #   国家/地区组才进得来。proxies 顺序 = 自动选择 → 节点选择 → DIRECT → 国家/地区，
  #   平铺节点由 include-all 追加在最后（内核行为，写不到前面）。
  # 组名硬写在这里：订阅里没有该组的话内核会整份配置校验失败，mega.js 会先检测再引用。
+proxy-groups:
  - name: 🌐 MEGA
    type: select
    icon: https://raw.githubusercontent.com/Vstory/mihomo-overrides/main/Icons/png/Mega.png
    include-all: true
    proxies:
      - ♻️自动选择
      - 🚀节点选择
      - DIRECT
      - 🌐 香港
      - 🌐 台湾
      - 🌐 日本
      - 🌐 韩国
      - 🌐 新加坡
      - 🌐 美国
      - 🌐 英国
      - 🌐 德国
      - 🌐 荷兰
      - 🌐 俄罗斯
      - 🌐 加拿大
      - 🌐 澳大利亚
      - 🌐 法国
      - 🌐 马来西亚
      - 🌐 泰国
      - 🌐 越南
      - 🌐 印度
      - 🌐 印度尼西亚
      - 🌐 菲律宾
      - 🌐 土耳其
      - 🌐 巴西
      - 🌐 阿联酋
      - 🌐 意大利
      - 🌐 西班牙

  # 国家/地区组：固定 24 个清单，filter 在运行时匹配节点名（provider 里的节点也能筛）。
  #   · (?i) 必须带：内核 filter 走 regexp2，默认区分大小写
  #   · 两字母代码包 \b 词边界，否则 US 会吃 Russia、IN 会吃 Singapore
  #   · empty-fallback 必须显式写 DIRECT：内核默认回退 COMPATIBLE，订阅没这个组会校验失败
  #   · lazy 只在使用时测速省电；tolerance 防抖（延迟差 50ms 内不换节点）
proxy-groups+:
  - name: 🌐 香港
    type: url-test
    include-all: true
    filter: '(?i)香港|🇭🇰|\bhk\b|hong ?kong|港'
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true
    empty-fallback: DIRECT
  - name: 🌐 台湾

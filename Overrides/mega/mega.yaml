+rules:
  # rules 顺序匹配，必须前插：追加到末尾等于永不命中（订阅的兜底规则先吃掉流量）
  - GEOSITE,mega,🌐 MEGA
  # 网段直接取 AS203055 + AS205809 的公开公告前缀（RIPEstat），全量收、不聚合：
  # 聚合会顺带覆盖同段里的邻接分配，而且漏掉 2a0b:e46:1::/48 这种零散前缀时无从察觉。
  # 公告前缀会变，IP-ASN 放在最后当动态兜底。
  - IP-CIDR,162.208.16.0/24,🌐 MEGA,no-resolve
  - IP-CIDR,185.206.24.0/24,🌐 MEGA,no-resolve
  - IP-CIDR,185.206.25.0/24,🌐 MEGA,no-resolve

# Title: PlayStore 覆写（YAML）
# Description: 订阅全部节点经 include-all 并入 🛍️ Google Play 组，8 条域名规则前插
# Version: 0.0.1
# Last modified: 2026-11-04 23:26
# Changelog: initial override for Google Play
#
# 用法：Mishka → 配置 → 覆写 → 新增 → 远程下载 → 填本文件 raw 地址。
#   键位语法按 PC 版：+key 数组前插、key+ 追加、key! 强制替换、其余深度合并。
#   组位置：键位只有前插（+proxy-groups）与追加（proxy-groups+），落不到指定位置。本文件用前插，
#   🛍️ Google Play 会出现在列表最顶端；要排在「节点选择」「自动选择」之后请改用 PlayStore.js。
#   rules 是顺序匹配：必须前插，追加到末尾等于永不命中（订阅的兜底规则先吃掉流量）。
#   前插的 Play 规则会盖掉订阅自带的「谷歌商店」分流，Play 流量统一归本组。
#
# 域名清单取自 v2fly/domain-list-community 的 google-play 分类（与 geosite 同源），逐条转写：
#   普通项 → DOMAIN-SUFFIX；full:redirector.c.play.google.com → DOMAIN 精确匹配。
#   分类里带 @cn 的两条正则（^r+[0-9]+(---|\.)sn-(2x3|ni5|j5o)\w{5}\.xn--ngstr-lra8j\.com$ 与
#   同形的 googlevideo.com 版）不收：前者已被 DOMAIN-SUFFIX,xn--ngstr-lra8j.com 完全覆盖。
#
# xn--ngstr-lra8j.com 是 Play 的 APK/OBB 下载域，这里按你的要求整体走代理。代价要知道：
#   该域下的主机名（rr*---sn-j5o*/ni5*/2x3*）绑死在国内 GGC 节点上 —— j5o=广州、ni5=上海、
#   2x3=北京，实测本机 DNS、Google DoH、Cloudflare DoH 三方解析同一个主机名都返回国内 IP
#   （如 58.63.233.67，广州电信 AS4134），换 DNS 也拿不到境外地址。因此走境外节点时，
#   这些下载连接可能 dial tcp <国内 IP>:443 i/o timeout（连的是中国电信的地址，出口却在海外）。
#   本组首选项里备了 DIRECT：真遇上超时，在 App 里把 🛍️ Google Play 切到 DIRECT 即走国内节点下载。
#
# 不收 gvt1.com / gvt2.com：那是 Chrome 与 Google 组件更新域，收进来会连带把系统更新流量也代理掉，
# 超出 Play 商店的范围。
# 没有 IP 规则：Play 的商店与 API 都在 Google 自有 Anycast 上，没有可按网段收的独立段。
#
#   include-all 让组自动并入订阅里的全部节点，换订阅、加节点都不用改本文件。代价：机场塞的伪节点
#   （"剩余流量：948 GB"这类）也会进组，且 exclude-filter 管不到 include-all 的项 —— 要剔掉伪节点
#   请改用 PlayStore.js。

  # 主组用 select：只有 select 的成员能放 proxy-group，「自动选择」「节点选择」和下面的
  #   国家/地区组才进得来。proxies 顺序 = 自动选择 → 节点选择 → DIRECT → 国家/地区，
  #   平铺节点由 include-all 追加在最后（内核行为，写不到前面）。
  # 组名硬写在这里：订阅里没有该组的话内核会整份配置校验失败，PlayStore.js 会先检测再引用。
+proxy-groups:
  - name: 🛍️ Google Play
    type: select
    icon: https://raw.githubusercontent.com/Vstory/mihomo-overrides/main/Icons/png/PlayStore.png
    include-all: true
    proxies:
      - ♻️自动选择
      - 🚀节点选择
      - DIRECT
      - 🛍️ 香港
      - 🛍️ 台湾
      - 🛍️ 日本
      - 🛍️ 韩国
      - 🛍️ 新加坡
      - 🛍️ 美国
      - 🛍️ 英国
      - 🛍️ 德国
      - 🛍️ 荷兰
      - 🛍️ 俄罗斯
      - 🛍️ 加拿大
      - 🛍️ 澳大利亚
      - 🛍️ 法国
      - 🛍️ 马来西亚
      - 🛍️ 泰国
      - 🛍️ 越南
      - 🛍️ 印度
      - 🛍️ 印度尼西亚
      - 🛍️ 菲律宾
      - 🛍️ 土耳其
      - 🛍️ 巴西
      - 🛍️ 阿联酋
      - 🛍️ 意大利
      - 🛍️ 西班牙

  # 国家/地区组：固定 24 个清单，filter 在运行时匹配节点名（provider 里的节点也能筛）。
  #   · (?i) 必须带：内核 filter 走 regexp2，默认区分大小写
  #   · 两字母代码包 \b 词边界，否则 US 会吃 Russia、IN 会吃 Singapore
  #   · empty-fallback 必须显式写 DIRECT：内核默认回退 COMPATIBLE，订阅没这个组会校验失败
  #   · lazy 只在使用时测速省电；tolerance 防抖（延迟差 50ms 内不换节点）
proxy-groups+:
  - name: 🛍️ 香港
    type: url-test
    include-all: true
    filter: '(?i)香港|🇭🇰|\bhk\b|hong ?kong|港'
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true
    empty-fallback: DIRECT
  - name: 🛍️ 台湾
    type: url-test
    include-all: true
    filter: '(?i)台湾|台灣|🇹🇼|\btw\b|taiwan|台'

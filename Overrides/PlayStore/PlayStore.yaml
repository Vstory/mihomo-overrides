+rules:
  # rules 顺序匹配，必须前插：追加到末尾等于永不命中（订阅的兜底规则先吃掉流量）
  # DOMAIN-SUFFIX 自带子域（*.play.google.com、play-*.googleapis.com 这些），不用逐条写
  - DOMAIN-SUFFIX,play.google.com,🛍️ Google Play
  - DOMAIN-SUFFIX,googleplay.com,🛍️ Google Play
  - DOMAIN-SUFFIX,play.googleapis.com,🛍️ Google Play
  - DOMAIN-SUFFIX,play-fe.googleapis.com,🛍️ Google Play
  - DOMAIN-SUFFIX,play-lh.googleusercontent.com,🛍️ Google Play
  - DOMAIN-SUFFIX,play-games.googleusercontent.com,🛍️ Google Play
  - DOMAIN-SUFFIX,xn--ngstr-lra8j.com,🛍️ Google Play
  - DOMAIN,redirector.c.play.google.com,🛍️ Google Play

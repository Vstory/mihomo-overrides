# Version 0.1.5 · 2026-10-29 00:23 ── use PascalCase icon filenames
# GitHub 覆写（YAML）。用法：Mishka → 配置 → 覆写 → 新增 → 远程下载 → 填本文件 raw 地址。
#   键位语法按 PC 版：+key 数组前插、key+ 追加、key! 强制替换、其余深度合并。
#   组位置：键位只有前插（+proxy-groups）与追加（proxy-groups+），落不到指定位置。本文件用前插，
#   GitHub 会出现在列表最顶端；要排在「节点选择」「自动选择」之后请改用 github.js。
#   rules 是顺序匹配：必须前插，追加到末尾等于永不命中（订阅的兜底规则先吃掉流量）。
#
#   范围取舍（有意排除的项）：
#     - github.io：全世界用户的 Pages 站点，访问任何人的博客都会命中，收进来等于把整个互联网往组里塞。
#     - ghcr.io / npmjs：镜像与包下载，大流量且多数场景应直连或走别的组。
#     - githubstatus / cafe / collector 等遥测域名：不影响功能，收进来只是徒增规则。
#
#   没有 IP 规则，原因：
#     - GitHub 的 Release 与资源下载走 Amazon S3（github-production-*.s3.amazonaws.com）和
#       Azure Blob（productionresultssa*），这些不在 GitHub 自己的 AS36459 里，IP-ASN 兜不住。
#     - api.github.com/meta 公布的段是 web/API 出口，与下载链不同源，按 IP 收会挂一半漏一半。
#       凑不出「域名 + 网段 + ASN」三层，就不要硬凑（同 boosty 的处理）。
#
#   include-all 让组自动并入订阅里的全部节点，换订阅、加节点都不用改本文件。代价：机场塞的伪节点
#   （"剩余流量：948 GB"这类）也会进组，且 exclude-filter 管不到 include-all 的项 —— 要剔掉伪节点
#   请改用 github.js。

  # 主组用 select：只有 select 的成员能放 proxy-group，「自动选择」「节点选择」和下面的
  #   国家/地区组才进得来。proxies 顺序 = 自动选择 → 节点选择 → DIRECT → 国家/地区，
  #   平铺节点由 include-all 追加在最后（内核行为，写不到前面）。
  # 组名硬写在这里：订阅里没有该组的话内核会整份配置校验失败，github.js 会先检测再引用。
+proxy-groups:
  - name: 🐙 GitHub
    type: select
    icon: https://raw.githubusercontent.com/Vstory/mihomo-overrides/main/Icons/png/GitHub.png
    include-all: true
    proxies:
      - ♻️自动选择
      - 🚀节点选择
      - DIRECT
      - 🐙 香港
      - 🐙 台湾
      - 🐙 日本
      - 🐙 韩国
      - 🐙 新加坡
      - 🐙 美国
      - 🐙 英国
      - 🐙 德国
      - 🐙 荷兰
      - 🐙 俄罗斯
      - 🐙 加拿大
      - 🐙 澳大利亚
      - 🐙 法国
      - 🐙 马来西亚
      - 🐙 泰国
      - 🐙 越南
      - 🐙 印度
      - 🐙 印度尼西亚
      - 🐙 菲律宾
      - 🐙 土耳其
      - 🐙 巴西
      - 🐙 阿联酋
      - 🐙 意大利
      - 🐙 西班牙

  # 国家/地区组：固定 24 个清单，filter 在运行时匹配节点名（provider 里的节点也能筛）。
  #   · (?i) 必须带：内核 filter 走 regexp2，默认区分大小写
  #   · 两字母代码包 \b 词边界，否则 US 会吃 Russia、IN 会吃 Singapore
  #   · empty-fallback 必须显式写 DIRECT：内核默认回退 COMPATIBLE，订阅没这个组会校验失败
  #   · lazy 只在使用时测速省电；tolerance 防抖（延迟差 50ms 内不换节点）
proxy-groups+:
  - name: 🐙 香港
    type: url-test
    include-all: true
    filter: '(?i)香港|🇭🇰|\bhk\b|hong ?kong|港'
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true
    empty-fallback: DIRECT
  - name: 🐙 台湾
    type: url-test
    include-all: true
    filter: '(?i)台湾|台灣|🇹🇼|\btw\b|taiwan|台'
